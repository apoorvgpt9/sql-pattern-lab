  source: leetcode
  source_id: 3673
  title: Find Zombie Sessions
  url: https://leetcode.com/problems/find-zombie-sessions/
  difficulty: hard
  free_verified: true
  free_evidence:
  - doocs/leetcode solution/DATABASE_README_EN.md (no lock icon)
  - Zanger67/leetcode-question-data data/leetcode.json paidOnly=false (LeetCode API snapshot dated 2026-11-04)
  - kamyu104/LeetCode-Solutions README SQL table (no lock icon)
  license: leetcode-proprietary-link-only
  postgres_on_leetcode: unknown
  pattern_primary: sessionization
  pattern_secondary:
  - conditional_aggregation
  - session_metrics
  batch: B5
  trigger_phrases:
  - phrase: session duration is more than 30 minutes
    meaning: TIMESTAMPDIFF(MINUTE, MIN(ts), MAX(ts)) > 30 per session_id
  - phrase: at least 5 scroll events
    meaning: SUM(event_type='scroll') >= 5
  - phrase: click-to-scroll ratio is less than 0.20
    meaning: clicks / scrolls < 0.2, strict
  - phrase: No purchases
    meaning: SUM(event_type='purchase') = 0
  schema:
  - table: app_events
    columns:
    - name: event_id
      type: int
      pk: true
    - name: user_id
      type: int
    - name: event_timestamp
      type: datetime
    - name: event_type
      type: varchar
      note: app_open|click|scroll|purchase|app_close
    - name: session_id
      type: varchar
    - name: event_value
      type: int
      note: purchase $ / scroll px / NULL
    grain: one row per event
  requirement: Per session_id, compute duration in whole minutes between the first and last event, scroll count,
    click count, purchase count. A session is a zombie if duration > 30 minutes, scrolls >= 5, clicks/scrolls <
    0.20, and no purchases. Report zombie sessions.
  output:
    columns:
    - session_id
    - user_id
    - session_duration_minutes
    - scroll_count
    ordering: scroll_count DESC, session_id ASC
    grain: one row per zombie session
  rules:
    ties: n/a
    nulls: event_value irrelevant
    empty: empty -> empty
    other: ratio exactly 0.20 does not qualify; doocs reference uses duration >= 30 although the statement says
      'more than 30'
  confidence: medium
  confidence_note: Duration boundary (> vs >= 30) differs between statement and reference solution.
- id: 38
  source: leetcode
  source_id: 3617
  title: Find Students with Study Spiral Pattern
  url: https://leetcode.com/problems/find-students-with-study-spiral-pattern/
  difficulty: hard
  free_verified: true
  free_evidence:
  - doocs/leetcode solution/DATABASE_README_EN.md (no lock icon)
  - Zanger67/leetcode-question-data data/leetcode.json paidOnly=false (LeetCode API snapshot dated 2026-11-04)
  - kamyu104/LeetCode-Solutions README SQL table (no lock icon)
  license: leetcode-proprietary-link-only
  postgres_on_leetcode: unknown
  pattern_primary: sessionization
  pattern_secondary:
  - cyclic_sequence_check
  - lag_lead
  - not_exists
  batch: B5
  trigger_phrases:
  - phrase: repeating sequence
    meaning: session i's subject must equal session ((i-1) mod k)+1's subject
  - phrase: at least 2 complete cycles
    meaning: session count >= 2k and divisible by k
  - phrase: no gaps longer than 2 days
    meaning: LAG(session_date) diff <= 2 for every consecutive pair
  - phrase: cycle length of at least 3
    meaning: k = COUNT(DISTINCT subject) >= 3
  schema:
  - table: students
    columns:
    - name: student_id
      type: int
      pk: true
    - name: student_name
      type: varchar
    - name: major
      type: varchar
    grain: one row per student
  - table: study_sessions
    columns:
    - name: session_id
      type: int
      pk: true
    - name: student_id
      type: int
    - name: subject
      type: varchar
    - name: session_date
      type: date
    - name: hours_studied
      type: decimal
    grain: one row per study session
  requirement: 'Order each student''s sessions by (session_date, session_id). Let k = number of distinct subjects
    the student studied. The student qualifies if: k >= 3; every gap between consecutive sessions is at most 2 days;
    the number of sessions is a multiple of k and at least 2k; and the subject sequence is the first k subjects
    repeated exactly (session n has the same subject as session ((n-1) mod k)+1). Report k and the sum of hours
    across all their sessions.'
  output:
    columns:
    - student_id
    - student_name
    - major
    - cycle_length
    - total_study_hours
    ordering: cycle_length DESC, total_study_hours DESC
    grain: one row per qualifying student
  rules:
    ties: ordering ties beyond the two keys unspecified
    nulls: n/a
    empty: students without sessions excluded
    other: interpretation treats the whole session history as the pattern (no sub-window search)
  confidence: low
  confidence_note: Statement is vague (does the pattern have to cover all sessions? can a qualifying sub-window
    exist inside noisy history? partial trailing cycle?). Spec mirrors the doocs reference interpretation; verify
    against LeetCode before building tests.
- id: 39
  source: leetcode
  source_id: 608
  title: Tree Node
  url: https://leetcode.com/problems/tree-node/
  difficulty: medium
  free_verified: true
  free_evidence:
  - doocs/leetcode solution/DATABASE_README_EN.md (no lock icon)
  - Zanger67/leetcode-question-data data/leetcode.json paidOnly=false (LeetCode API snapshot dated 2026-11-04)
  - kamyu104 README still shows a lock (stale; problem was unlocked later, both current sources agree it is free)
  license: leetcode-proprietary-link-only
  postgres_on_leetcode: unknown
  pattern_primary: recursive_cte
  pattern_secondary:
  - existence
  - hierarchy_classification
  batch: B6
  trigger_phrases:
  - phrase: Root ... Inner ... Leaf
    meaning: 'CASE: p_id IS NULL -> Root; has a child (EXISTS row with p_id = id) -> Inner; else Leaf'
  - phrase: valid tree
    meaning: exactly one root; a lone root with no children is still 'Root'
  schema:
  - table: Tree
    columns:
    - name: id
      type: int
      pk: true
    - name: p_id
      type: int
      note: parent id; NULL for root
    grain: one row per node
  requirement: Label each node 'Root' if it has no parent, 'Inner' if it has a parent and at least one child, otherwise
    'Leaf'.
  output:
    columns:
    - id
    - type
    ordering: any order
    grain: one row per node
  rules:
    ties: n/a
    nulls: beware NOT IN (SELECT p_id ...) when p_id contains NULL - returns nothing; use NOT EXISTS or filter NULLs
    empty: n/a
    other: Root check must come first in CASE
  confidence: high
