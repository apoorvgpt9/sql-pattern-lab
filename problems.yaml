- id: 42
  source: pgexercises
  source_id: recursive/getupwardall
  title: Produce a CTE that can return the upward recommendation chain for any member
  url: https://pgexercises.com/questions/recursive/getupwardall.html
  difficulty: hard
  free_verified: true
  free_evidence:
  - pgexercises.com is free with no account; content CC BY-SA 3.0
  license: CC BY-SA 3.0 (pgexercises.com site footer; questions/LICENSE in github.com/AlisdairO/pgexercises)
  license_evidence:
  - 'https://pgexercises.com/ (footer: ''Site content licensed under CC BY-SA 3.0'')'
  - https://github.com/AlisdairO/pgexercises/blob/master/questions/LICENSE
  postgres_on_leetcode: n/a
  pattern_primary: recursive_cte
  pattern_secondary:
  - closure_table
  - carry_anchor_column
  batch: B6
  trigger_phrases:
  - phrase: for any member
    meaning: anchor must be ALL members, carrying the starting member through recursion
  - phrase: upward recommendation chain
    meaning: recursive step follows recommendedby upward
  - phrase: chains for members 12 and 22
    meaning: filter only at the end, after building the full closure
  schema:
  - *id001
  requirement: Build a recursive CTE mapping every member to each of their ancestors in the recommendation chain
    (recommender, recommender's recommender, ...). Use it to output, for members 12 and 22, each ancestor's memid
    and that ancestor's first name and surname.
  output:
    columns:
    - member
    - recommender
    - firstname
    - surname
    ordering: member ASC, recommender DESC
    grain: one row per (member, ancestor) for members 12 and 22
  rules:
    ties: n/a
    nulls: chain stops when recommendedby is NULL; do not emit a NULL recommender row
    empty: member with no recommender -> no rows for that member
    other: firstname/surname belong to the recommender, not the member
  confidence: high
  difficulty_source: curator judgement (pgexercises has no difficulty labels)
  attribution: Adapted from PostgreSQL Exercises by Alisdair Owens (pgexercises.com), CC BY-SA 3.0. Spec reworded.
  dataset: pgexercises 'clubdata' (cd schema). Data dump is at github.com/AlisdairO/pgexercises/database/clubdata.sql
    (CC BY-SA). Build sessions without internet must synthesise fixtures matching this schema.
  dialect_note: Original is PostgreSQL; MySQL 8.0 equivalent is fine (drop the cd. schema prefix or create schema
    cd).
- id: 43
  source: leetcode
  source_id: 3482
  title: Analyze Organization Hierarchy
  url: https://leetcode.com/problems/analyze-organization-hierarchy/
  difficulty: hard
  free_verified: true
  free_evidence:
  - doocs/leetcode solution/DATABASE_README_EN.md (no lock icon)
  - Zanger67/leetcode-question-data data/leetcode.json paidOnly=false (LeetCode API snapshot dated 2026-11-04)
  - kamyu104/LeetCode-Solutions README SQL table (no lock icon)
  license: leetcode-proprietary-link-only
  postgres_on_leetcode: unknown
  pattern_primary: recursive_cte
  pattern_secondary:
  - closure_table
  - subtree_aggregation
  batch: B6
  trigger_phrases:
  - phrase: CEO is level 1
    meaning: recursive depth from manager_id IS NULL
  - phrase: direct and indirect reports
    meaning: need every (ancestor, descendant) pair - a closure table - not just direct children
  - phrase: plus their own salary
    meaning: budget = own salary + sum of all descendants' salaries
  - phrase: ordered by level ... budget ... employee_name
    meaning: level ASC, budget DESC, employee_name ASC
  schema:
  - table: Employees
    columns:
    - name: employee_id
      type: int
      pk: true
    - name: employee_name
      type: varchar
    - name: manager_id
      type: int
      note: NULL for CEO
    - name: salary
      type: int
    - name: department
      type: varchar
    grain: one row per employee
  requirement: 'For every employee compute: level (CEO = 1, each step down +1); team_size = number of direct plus
    indirect reports (0 for non-managers); budget = own salary + total salary of all direct and indirect reports.'
  output:
    columns:
    - employee_id
    - employee_name
    - level
    - team_size
    - budget
    ordering: level ASC, budget DESC, employee_name ASC
    grain: one row per employee (including non-managers)
  rules:
    ties: see ordering
    nulls: team_size 0, budget = own salary for leaves
    empty: n/a
    other: single CEO assumed
  confidence: high
- id: 44
  source: pgexercises
  source_id: aggregates/classify
  title: Classify facilities by value
  url: https://pgexercises.com/questions/aggregates/classify.html
  difficulty: medium
  free_verified: true
  free_evidence:
  - pgexercises.com is free with no account; content CC BY-SA 3.0
  license: CC BY-SA 3.0 (pgexercises.com site footer; questions/LICENSE in github.com/AlisdairO/pgexercises)
  license_evidence:
  - 'https://pgexercises.com/ (footer: ''Site content licensed under CC BY-SA 3.0'')'
  - https://github.com/AlisdairO/pgexercises/blob/master/questions/LICENSE
  postgres_on_leetcode: n/a
  pattern_primary: median_percentile
  pattern_secondary:
  - ntile_buckets
  - window_over_aggregate
  batch: B6
  trigger_phrases:
  - phrase: equally sized groups
    meaning: NTILE(3) over revenue DESC = tercile buckets
  - phrase: high, average, and low
    meaning: map bucket 1/2/3 to labels with CASE
  - phrase: based on their revenue
    meaning: aggregate revenue per facility first, then window
  schema:
  - *id002
  - *id003
  requirement: 'Revenue per booking = slots * guestcost if memid = 0 else slots * membercost. Total revenue per
    facility (facilities with bookings), split facilities into 3 groups of as-equal-as-possible size by revenue
    descending (NTILE semantics: earlier buckets get the extra rows), and label bucket 1 ''high'', 2 ''average'',
    3 ''low''.'
  output:
    columns:
    - name
    - revenue
    ordering: bucket number ascending (high, average, low), then name ascending
    grain: one row per facility with bookings
  rules:
    ties: equal revenues may land in different buckets (NTILE is positional)
    nulls: n/a
    empty: n/a
    other: '''revenue'' output column holds the LABEL, not the number'
  confidence: high
  difficulty_source: curator judgement (pgexercises has no difficulty labels)
  attribution: Adapted from PostgreSQL Exercises by Alisdair Owens (pgexercises.com), CC BY-SA 3.0. Spec reworded.
  dataset: pgexercises 'clubdata' (cd schema). Data dump is at github.com/AlisdairO/pgexercises/database/clubdata.sql
    (CC BY-SA). Build sessions without internet must synthesise fixtures matching this schema.
  dialect_note: Original is PostgreSQL; MySQL 8.0 equivalent is fine (drop the cd. schema prefix or create schema
    cd).
- id: 45
  source: original
  source_id: SPL-MED-01
  title: Median Order Amount per Store
  url: null
  difficulty: hard
  free_verified: null
  free_evidence:
  - authored for sql-pattern-lab; no third-party content
  license: original-work (sql-pattern-lab; no third-party text)
  license_evidence: null
  postgres_on_leetcode: n/a
  pattern_primary: median_percentile
  pattern_secondary:
  - row_number_and_count
  - even_odd_middle
  batch: B6
  trigger_phrases:
  - phrase: median order amount per store
    meaning: 'no MEDIAN()/PERCENTILE_CONT in MySQL 8: ROW_NUMBER + COUNT per partition'
  - phrase: even number of orders
    meaning: average the two middle values
  - phrase: duplicate amounts
    meaning: ties must not break positional logic -> ROW_NUMBER with a tiebreak column, not RANK
  schema:
  - table: StoreOrders
    columns:
    - name: order_id
      type: int
      pk: true
    - name: store_id
      type: int
    - name: amount
      type: decimal(10,2)
    grain: one row per order
  requirement: 'For each store, report the median of its order amounts: with n orders sorted by amount (ties broken
    by order_id), the median is the middle value when n is odd and the mean of the two middle values when n is even.
    Round to 2 decimals. Stores with no orders do not appear.'
  output:
    columns:
    - store_id
    - median_amount
    ordering: store_id ascending
    grain: one row per store with orders
  rules:
    ties: duplicate amounts are fine; positions use (amount, order_id)
    nulls: amount is never NULL
    empty: empty table -> empty result
    other: rows with ROW_NUMBER IN (FLOOR((n+1)/2), FLOOR(n/2)+1) are the middle rows
  confidence: high
  difficulty_source: curator judgement
  confidence_note: 'Original problem authored to fill the median gap (LeetCode #569 and #571 are Premium). Build
    session must create its own fixtures.'
