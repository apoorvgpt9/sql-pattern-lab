  - union_all
  batch: B6
  trigger_phrases:
  - phrase: people who have the most friends
    meaning: 'friendship is symmetric: UNION ALL (requester, accepter) with (accepter, requester), then count per
      person'
  - phrase: only one person has the most friends
    meaning: ORDER BY count DESC LIMIT 1 is acceptable
  schema:
  - table: RequestAccepted
    columns:
    - name: requester_id
      type: int
