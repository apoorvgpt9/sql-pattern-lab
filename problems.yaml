  batch: B1
  trigger_phrases:
  - phrase: for each month and country
    meaning: GROUP BY DATE_FORMAT(trans_date,'%Y-%m'), country
  - phrase: number of approved transactions
    meaning: SUM(state='approved') in the same pass as COUNT(*)
  - phrase: their total amount
    meaning: SUM(CASE WHEN approved THEN amount ELSE 0 END)
  schema:
  - table: Transactions
    columns:
    - name: id
      type: int
      pk: true
    - name: country
      type: varchar
    - name: state
      type: enum('approved','declined')
    - name: amount
      type: int
    - name: trans_date
      type: date
    grain: one row per transaction
  requirement: For each (month, country) group, report total transaction count, approved transaction count, total
    amount over all transactions, and total amount over approved transactions. month is formatted 'YYYY-MM'.
  output:
    columns:
    - month
    - country
    - trans_count
    - approved_count
    - trans_total_amount
    - approved_total_amount
    ordering: any order
    grain: one row per (month, country) present in data
  rules:
    ties: n/a
    nulls: approved_count / approved_total_amount are 0 (not NULL) when a group has no approved rows; hidden tests
      are believed to include NULL country, which forms its own group
    empty: empty table -> empty result
    other: month string 'YYYY-MM'
  confidence: medium
  confidence_note: NULL-country behaviour recalled from community discussion, not visible in the statement text
    available offline.
- id: 5
  source: leetcode
  source_id: 3657
  title: Find Loyal Customers
  url: https://leetcode.com/problems/find-loyal-customers/
  difficulty: medium
  free_verified: true
  free_evidence:
  - doocs/leetcode solution/DATABASE_README_EN.md (no lock icon)
  - Zanger67/leetcode-question-data data/leetcode.json paidOnly=false (LeetCode API snapshot dated 2026-11-04)
  - kamyu104/LeetCode-Solutions README SQL table (no lock icon)
  license: leetcode-proprietary-link-only
  postgres_on_leetcode: unknown
  pattern_primary: conditional_aggregation
  pattern_secondary:
  - having_filters
  batch: B1
  trigger_phrases:
  - phrase: ALL the following criteria
    meaning: each criterion becomes one HAVING predicate on the same GROUP BY
  - phrase: at least 3 purchase transactions
    meaning: count only rows with transaction_type='purchase'
  - phrase: active for at least 30 days
    meaning: DATEDIFF(MAX(date), MIN(date)) >= 30
  - phrase: refund rate is less than 20%
    meaning: refunds / all transactions < 0.2, strict
  schema:
  - table: customer_transactions
    columns:
    - name: transaction_id
      type: int
      pk: true
    - name: customer_id
      type: int
    - name: transaction_date
      type: date
    - name: amount
      type: decimal
    - name: transaction_type
      type: varchar
      note: '''purchase'' or ''refund'''
    grain: one row per transaction
  requirement: 'Return customers meeting all of: at least 3 transactions of type ''purchase''; the span between
    their earliest and latest transaction dates (any type) is at least 30 days; refund count divided by their total
    transaction count (purchases + refunds) is strictly below 0.20.'
  output:
    columns:
    - customer_id
    ordering: customer_id ascending
    grain: one row per qualifying customer
  rules:
    ties: n/a
    nulls: none expected
    empty: empty -> empty
    other: 'boundary: exactly 30 days qualifies; exactly 20% refund rate does NOT qualify'
  confidence: medium
  confidence_note: Statement says 'purchase transactions' but the doocs reference solution counts all rows (COUNT(1)
    >= 3); also unclear whether the 30-day span uses all transactions or purchases only. Spec follows the statement
    wording; verify on LeetCode.
- id: 6
  source: leetcode
  source_id: 3705
  title: Find Golden Hour Customers
  url: https://leetcode.com/problems/find-golden-hour-customers/
  difficulty: medium
  free_verified: true
  free_evidence:
  - doocs/leetcode solution/DATABASE_README_EN.md (no lock icon)
  - Zanger67/leetcode-question-data data/leetcode.json paidOnly=false (LeetCode API snapshot dated 2026-11-04)
  - kamyu104/LeetCode-Solutions README SQL table (no lock icon)
  license: leetcode-proprietary-link-only
  postgres_on_leetcode: unknown
  pattern_primary: conditional_aggregation
  pattern_secondary:
  - having_filters
  - time_of_day
  batch: B1
  trigger_phrases:
  - phrase: at least 60% of their orders
    meaning: SUM(is_peak)/COUNT(*) >= 0.6; avoid float issues with 5*peak >= 3*total
  - phrase: 11:00-14:00 or 18:00-21:00
    meaning: TIME(order_timestamp) range test, two windows OR'd
  - phrase: average rating for rated orders
    meaning: AVG ignores NULL ratings automatically
  - phrase: rated at least 50% of their orders
    meaning: COUNT(order_rating)/COUNT(*) >= 0.5
  schema:
  - table: restaurant_orders
    columns:
    - name: order_id
      type: int
      pk: true
    - name: customer_id
      type: int
    - name: order_timestamp
      type: datetime
    - name: order_amount
      type: decimal
    - name: payment_method
      type: varchar
      note: cash|card|app
    - name: order_rating
      type: int
      note: 1-5 or NULL
    grain: one row per order
  requirement: 'Find customers with: at least 3 orders; at least 60% of orders placed in peak hours (11:00-14:00
    or 18:00-21:00); average rating over non-NULL ratings at least 4.0; and at least 50% of their orders rated.
    Report total orders, peak-hour percentage (0-100) and average rating rounded to 2 decimals.'
  output:
    columns:
    - customer_id
    - total_orders
    - peak_hour_percentage
    - average_rating
    ordering: average_rating DESC, customer_id DESC
    grain: one row per qualifying customer
  rules:
    ties: ordering ties broken by customer_id desc
    nulls: NULL ratings excluded from average but count toward total_orders
    empty: empty -> empty
    other: peak_hour_percentage appears to be rounded to an integer (doocs uses ROUND(x)); window ends inclusive
      per doocs (BETWEEN '11:00:00' AND '14:00:00')
  confidence: medium
  confidence_note: Rounding of peak_hour_percentage and whether 14:00:00 / 21:00:00 exactly count as peak are inferred
    from the reference solution, not stated explicitly.
