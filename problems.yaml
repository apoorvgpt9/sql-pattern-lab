  - 'https://pgexercises.com/ (footer: ''Site content licensed under CC BY-SA 3.0'')'
  - https://github.com/AlisdairO/pgexercises/blob/master/questions/LICENSE
  postgres_on_leetcode: n/a
  pattern_primary: recursive_cte
  pattern_secondary:
  - hierarchy_traversal_down
  batch: B6
  trigger_phrases:
  - phrase: recommended, and so on
    meaning: unbounded depth -> WITH RECURSIVE
  - phrase: downward
    meaning: anchor = members whose recommendedby = 1; recursive step joins recommendedby = previous memid
  schema:
  - *id001
  requirement: Return every member directly or indirectly recommended by member 1 (members they recommended, members
    those recommended, etc.), excluding member 1 itself.
  output:
    columns:
    - memid
    - firstname
    - surname
    ordering: memid ascending
    grain: one row per descendant member
  rules:
    ties: n/a
    nulls: recommendedby NULL = top of chain
    empty: member with no recommendees -> empty
    other: MySQL 8 supports WITH RECURSIVE
  confidence: high
