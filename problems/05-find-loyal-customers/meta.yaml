id: 5
source: leetcode
source_id: 3657
title: Find Loyal Customers
url: https://leetcode.com/problems/find-loyal-customers/
difficulty: medium
free_verified: true
free_evidence:
- doocs/leetcode solution/DATABASE_README_EN.md (no lock icon)
- Zanger67/leetcode-question-data data/leetcode.json paidOnly=false (LeetCode API snapshot dated 2026-11-04)
- kamyu104/LeetCode-Solutions README SQL table (no lock icon)
license: leetcode-proprietary-link-only
postgres_on_leetcode: unknown
pattern_primary: conditional_aggregation
pattern_secondary:
- having_filters
batch: B1
trigger_phrases:
- phrase: ALL the following criteria
  meaning: each criterion becomes one HAVING predicate on the same GROUP BY
- phrase: at least 3 purchase transactions
  meaning: count only rows with transaction_type='purchase'
- phrase: active for at least 30 days
  meaning: DATEDIFF(MAX(date), MIN(date)) >= 30
- phrase: refund rate is less than 20%
  meaning: refunds / all transactions < 0.2, strict
schema:
- table: customer_transactions
  columns:
  - name: transaction_id
    type: int
    pk: true
  - name: customer_id
    type: int
  - name: transaction_date
    type: date
  - name: amount
    type: decimal
  - name: transaction_type
    type: varchar
    note: '''purchase'' or ''refund'''
  grain: one row per transaction
requirement: 'Return customers meeting all of: at least 3 transactions of type ''purchase''; the span between their
  earliest and latest transaction dates (any type) is at least 30 days; refund count divided by their total transaction
  count (purchases + refunds) is strictly below 0.20.'
output:
  columns:
  - customer_id
  ordering: customer_id ascending
  grain: one row per qualifying customer
rules:
  ties: n/a
  nulls: none expected
  empty: empty -> empty
  other: 'boundary: exactly 30 days qualifies; exactly 20% refund rate does NOT qualify'
confidence: medium
confidence_note: Statement says 'purchase transactions' but the doocs reference solution counts all rows (COUNT(1)
  >= 3); also unclear whether the 30-day span uses all transactions or purchases only. Spec follows the statement
  wording; verify on LeetCode.
