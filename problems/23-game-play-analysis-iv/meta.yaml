- phrase: divide it by the number of total players
  meaning: denominator = all distinct players
schema:
- table: Activity
  columns:
  - name: player_id
    type: int
  - name: device_id
    type: int
  - name: event_date
    type: date
  - name: games_played
    type: int
  grain: PK (player_id, event_date)
requirement: Compute the fraction of all players who have an activity row exactly one day after their first-ever
  activity date. Round to 2 decimals.
output:
  columns:
  - fraction
  ordering: single row
  grain: one scalar row
rules:
  ties: n/a
  nulls: n/a
  empty: not tested
  other: only the day immediately after the FIRST login counts, not any consecutive pair
confidence: high
