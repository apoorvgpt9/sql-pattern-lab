[project]
name = "sql-pattern-lab"
version = "0.1.0"
description = "SQL interview patterns: decomposition, brute force to optimal, measured on MySQL 8.0"
requires-python = ">=3.11"
dependencies = ["PyMySQL>=1.1", "PyYAML>=6.0", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["harness"]
addopts = "-ra"
