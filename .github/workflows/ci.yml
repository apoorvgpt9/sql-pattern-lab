name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        # GitHub service containers cannot override the image command, so --local-infile=1 cannot
        # be passed here; it is a dynamic variable and is switched on in the "Wait for MySQL" step.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for MySQL (health check) and enable local_infile
        run: |
          python - <<'PY'
          from harness import db
          print("MySQL", db.wait_for_server(timeout_s=180))
          c = db.connect()
          with c.cursor() as cur:
              cur.execute("SET GLOBAL local_infile = 1")
              cur.execute("SELECT @@GLOBAL.local_infile")
              print("local_infile =", cur.fetchone()[0])
          PY

      - name: Correctness tests
        run: pytest -q harness

      # Catches gen.py data that LOAD DATA cannot load, or a broken renderer, before the
      # expensive bench workflow. Writes only to $RUNNER_TEMP; nothing is committed.
      - name: Bench pipeline smoke test (tiny sizes, results discarded)
        run: |
          python -m harness.bench --sizes 50,200 --repeats 1 --out "$RUNNER_TEMP/bench-smoke"
          cp -r problems "$RUNNER_TEMP/problems-copy"
          python scripts/render_bench.py --results "$RUNNER_TEMP/bench-smoke" --problems "$RUNNER_TEMP/problems-copy"
          python scripts/render_bench.py --results "$RUNNER_TEMP/bench-smoke" --problems "$RUNNER_TEMP/problems-copy" --check
